                        <script>
                            async function buscarCP() {
                                const cp = document.getElementById("codigo_postal").value;
                                const pais = document.getElementById("pais").value;
                    
                                if (cp.length === 5) {
                                    try {
                                        if (pais === "MX") {
                                    const token = 'fb554bc4-b5e0-4f18-bc4a-130cab156ef3';
                                    const respuesta = await fetch(`https://api.copomex.com/query/info_cp/${cp}?type=simplified&token=${token}`);
                                    const datos = await respuesta.json();
                                    if (!datos.error) {
                                        document.getElementById("estado").value = datos.response.estado;
                                        document.getElementById("municipio").value = datos.response.municipio;
                                    } else {
                                        limpiarCampos();
                                        alert("Código postal no encontrado.");
                                    }
                                } else if (pais === "US") {
                                    const respuesta = await fetch(`https://api.zippopotam.us/us/${cp}`);
                                    const datos = await respuesta.json();
                                    if (datos.places) {
                                        document.getElementById("estado").value = datos.places[0]["state"];
                                        document.getElementById("municipio").value = datos.places[0]["place name"];
                                    } else {
                                        limpiarCampos();
                                        alert("Código postal no encontrado.");
                                    }
                                }
                            } catch (error) {
                                console.error("Error al obtener datos:", error);
                                limpiarCampos();
                                alert("Error al obtener datos.");
                            }
                        }
                    }
            
                    function limpiarCampos() {
                        document.getElementById("estado").value = "";
                        document.getElementById("municipio").value = "";
                    }
                </script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const largoInput = document.querySelector('input[name="largo"]');
        const anchoInput = document.querySelector('input[name="ancho"]');
        const altoInput = document.querySelector('input[name="alto"]');
        const volumenInput = document.querySelector('input[name="volumen"]');
    
        function calcularVolumen() {
            const largo = parseFloat(largoInput.value) || 0;
            const ancho = parseFloat(anchoInput.value) || 0;
            const alto = parseFloat(altoInput.value) || 0;
            const volumen = largo * ancho * alto;
            volumenInput.value = volumen.toFixed(2);
        }
    
        largoInput.addEventListener("input", calcularVolumen);
        anchoInput.addEventListener("input", calcularVolumen);
        altoInput.addEventListener("input", calcularVolumen);
    });
    </script>
